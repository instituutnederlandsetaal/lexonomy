services:
    backend:
        build:
            context: .
            target: backend
        environment:
            DEBUG: "1"
            LEXONOMY_SITECONFIG: ${LEXONOMY_DEV_SITECONFIG:-}
            # A source installation in api/ may have its own config.
            LEXONOMY_SITECONFIG_FALLBACK: /opt/service/siteconfig.example.json
        volumes:
            - ./api:/opt/service/api:ro
            - ./config:/opt/service/config:ro
            - lexonomy_dev_data:/opt/service/data
    frontend:
        image: node:22-alpine
        working_dir: /opt/service/frontend
        command: sh -c "npm ci && exec npm start -- --host 0.0.0.0"
        environment:
            LEXONOMY_BACKEND_URL: ${LEXONOMY_BACKEND_URL:-http://backend:8000}
            CHOKIDAR_USEPOLLING: "true"
        volumes:
            # Docker creates the node_modules mountpoint on fresh checkouts.
            - ./frontend:/opt/service/frontend
            - lexonomy_dev_node_modules:/opt/service/frontend/node_modules
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
volumes:
    lexonomy_dev_data:
    lexonomy_dev_node_modules:
