services:
    lexonomy:
        image: ${ORG:-elexis-eu}/lexonomy:${VER:-dev}
        build:
            context: .
            args:
                VER: ${VER:-dev}
        volumes:
            - ./config:/opt/service/config:ro
            - lexonomy_data:/opt/service/data
        ports:
            - "8000:8000"
volumes:
    lexonomy_data:
